[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
version_path_separator = os

# Left blank on purpose: env.py resolves the URL the same way the running
# app does (DATABASE_URL env, else sqlite at app/storage.py's DB_PATH).
# Programmatic bootstrap calls from storage.py override this explicitly.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
