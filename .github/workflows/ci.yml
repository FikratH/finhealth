name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock
      # Proves requirements.lock — the runtime-only lock apps/api/Dockerfile
      # actually builds the shipping image from — resolves and installs
      # cleanly on its own, into a throwaway venv that's discarded right
      # after. Nothing runs against it (that's what the dev-lock install
      # below is for); this step exists only so a break in the artifact
      # that ships is never proven solely by a local venv someone deleted.
      - run: python -m venv /tmp/runtime-lock-check && /tmp/runtime-lock-check/bin/pip install -r requirements.lock && rm -rf /tmp/runtime-lock-check
      # Installs from the committed, fully-pinned dev lock (see
      # apps/api/README.md "Dependency locking" for how it's
      # generated/regenerated), not the loose requirements*.txt —
      # reproducible builds, not "whatever resolves today". The dev lock is
      # a superset of the runtime lock (requirements-dev.txt does `-r
      # requirements.txt` + pytest/httpx/moto), so this one install runs
      # and tests the app.
      - run: pip install -r requirements-dev.lock
      - run: python -m pytest tests -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      # `next build` always runs in production mode, and Better Auth
      # (apps/web/lib/auth.ts) throws at startup in production without a
      # real secret — this CI job never talks to a real Better Auth
      # deployment, so a fixed placeholder is fine here; it just needs to
      # exist. AUTH_JWT_SECRET stays unset (it's deliberately optional —
      # see apps/api/app/auth.py) and GOOGLE_CLIENT_ID/SECRET stay unset
      # (the Google button is correctly absent from the build either way).
      BETTER_AUTH_SECRET: ci-placeholder-secret-not-used-for-anything-real
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # Order is load-bearing, not incidental: tests/first-load-budget.
      # test.ts (P7 T1c) parses .next's own build manifests to prove gsap/
      # lenis never reach signin/my/methodology's first-load JS, and
      # self-skips with a clear reason when .next doesn't exist yet — so it
      # only actually runs (and only actually guards anything) here, after
      # `npm run build` above and inside `npm run test`'s normal vitest
      # suite. Reordering these two steps silently turns the guard into a
      # no-op rather than failing loud, so don't.
      - run: npm run test

  e2e:
    runs-on: ubuntu-latest
    needs: [api-tests, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      # apps/web/playwright.config.ts's webServer entry for the API half of
      # the dual-server pair it boots hardcodes `.venv/bin/uvicorn` (cwd
      # apps/api) — installing to that exact path from the same locks
      # api-tests uses lets the config resolve it unmodified.
      - name: Install API dependencies (venv path required by playwright.config.ts)
        working-directory: apps/api
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.lock -r requirements-dev.lock
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Resolve installed Playwright version
        id: playwright-version
        working-directory: apps/web
        run: |
          VERSION=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Install Playwright OS dependencies (browsers already cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: apps/web
        run: npx playwright install-deps chromium
      # playwright.config.ts's webServer boots both halves of the pair
      # itself (API via uvicorn, web via `next build && next start`) against
      # isolated tmp SQLite DBs — no separate build step needed here.
      - name: Run Playwright e2e suite
        working-directory: apps/web
        run: npm run e2e
      # playwright.config.ts sets trace: "retain-on-failure", and
      # apps/web/test-results/ is already gitignored to hold exactly this —
      # without uploading it, a CI failure here leaves only the `line`
      # reporter's console output, no trace/screenshot to actually debug
      # from. `if: failure()` only (never `always()`): a green run has
      # nothing worth keeping, and this is the one step that should run
      # when everything above it didn't.
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
