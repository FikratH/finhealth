name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock
      # Proves requirements.lock — the runtime-only lock apps/api/Dockerfile
      # actually builds the shipping image from — resolves and installs
      # cleanly on its own, into a throwaway venv that's discarded right
      # after. Nothing runs against it (that's what the dev-lock install
      # below is for); this step exists only so a break in the artifact
      # that ships is never proven solely by a local venv someone deleted.
      - run: python -m venv /tmp/runtime-lock-check && /tmp/runtime-lock-check/bin/pip install -r requirements.lock && rm -rf /tmp/runtime-lock-check
      # Installs from the committed, fully-pinned dev lock (see
      # apps/api/README.md "Dependency locking" for how it's
      # generated/regenerated), not the loose requirements*.txt —
      # reproducible builds, not "whatever resolves today". The dev lock is
      # a superset of the runtime lock (requirements-dev.txt does `-r
      # requirements.txt` + pytest/httpx/moto), so this one install runs
      # and tests the app.
      - run: pip install -r requirements-dev.lock
      - run: python -m pytest tests -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      # `next build` always runs in production mode, and Better Auth
      # (apps/web/lib/auth.ts) throws at startup in production without a
      # real secret — this CI job never talks to a real Better Auth
      # deployment, so a fixed placeholder is fine here; it just needs to
      # exist. AUTH_JWT_SECRET stays unset (it's deliberately optional —
      # see apps/api/app/auth.py) and GOOGLE_CLIENT_ID/SECRET stay unset
      # (the Google button is correctly absent from the build either way).
      BETTER_AUTH_SECRET: ci-placeholder-secret-not-used-for-anything-real
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test
      # `npm run e2e` (Playwright, apps/web/playwright.config.ts) is
      # intentionally not run here yet — it boots both the API (isolated
      # tmp SQLite) and the built web app as a pair of servers, and CI
      # envs for that dual-server boot aren't stable yet. Wired in Phase 6.
